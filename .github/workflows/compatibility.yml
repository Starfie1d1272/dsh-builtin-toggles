name: Upstream compatibility observation

on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-rc6:
    name: reviewed rc.6 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 11.21.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Cache reviewed rc.6 runtime npm downloads
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: fixtures/reviewed-rc6-runtime/package-lock.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack reviewed DSH artifacts in an isolated directory
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp/compatibility
          npm pack --pack-destination .agent-tmp/compatibility @deepseek-ai/dsh-base@0.1.0-rc.6 @deepseek-ai/dsh-web-app@0.1.0-rc.6
          BASE_TARBALL="$(find .agent-tmp/compatibility -maxdepth 1 -name '*dsh-base*.tgz' -print -quit)"
          WEB_TARBALL="$(find .agent-tmp/compatibility -maxdepth 1 -name '*dsh-web-app*.tgz' -print -quit)"
          test -n "$BASE_TARBALL" && test -n "$WEB_TARBALL"
          tar -xzf "$BASE_TARBALL" -C .agent-tmp/compatibility
          mv .agent-tmp/compatibility/package .agent-tmp/compatibility/dsh-base
          tar -xzf "$WEB_TARBALL" -C .agent-tmp/compatibility
          mv .agent-tmp/compatibility/package .agent-tmp/compatibility/dsh-web-app
          pnpm verify:baseline .agent-tmp/compatibility/dsh-base/cordis.patch.yml .agent-tmp/compatibility/dsh-web-app/cordis.patch.yml | tee .agent-tmp/compatibility/baseline.json
      - name: Exercise legacy, v1, mutation, restore, drift, and trust fences
        run: pnpm test
      - name: Validate the generated plugin tarball
        run: pnpm pack:check
      - name: Install, load, restart, and smoke the reviewed DSH Web profile
        run: |
          set -euo pipefail
          PLUGIN_TARBALL="$(npm pack --silent --pack-destination .agent-tmp/compatibility)"
          ISOLATED="$RUNNER_TEMP/dsh-builtin-toggles-rc6"
          mkdir -p "$ISOLATED"
          cp "$GITHUB_WORKSPACE/fixtures/reviewed-rc6-runtime/package.json" "$GITHUB_WORKSPACE/fixtures/reviewed-rc6-runtime/package-lock.json" "$ISOLATED/"
          cd "$ISOLATED"
          npm ci
          export DSH_HOME="$ISOLATED/home"
          DSH_PORT=39103
          DSH="$ISOLATED/node_modules/.bin/dsh"
          "$DSH" plugin --profile web add "$GITHUB_WORKSPACE/.agent-tmp/compatibility/$PLUGIN_TARBALL"
          wait_for_inspection() {
            local output="$1"
            for attempt in $(seq 1 40); do
              if curl --fail --silent "http://127.0.0.1:$DSH_PORT/api/builtin-toggles/v1/inspection" > "$output" && test -s "$output"; then
                return 0
              fi
              sleep 1
            done
            echo 'timed out waiting for v1 inspection' >&2
            cat "$ISOLATED/dsh.log" >&2 || true
            return 1
          }
          assert_goal() {
            node --input-type=module - "$1" "$2" "$3" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [file, expectedOverride, expectedDisabled] = process.argv.slice(2)
          const inspection = JSON.parse(await readFile(file, 'utf8'))
          if (inspection.schemaVersion !== 'builtin-toggles.inspection/v1') throw new Error('unexpected inspection schema')
          const goal = inspection.capabilities?.find((entry) => entry.id === 'ui-goal')
          if (!goal) throw new Error('inspection missing ui-goal')
          if (goal.configuration?.profileOverride?.state !== expectedOverride) throw new Error(`expected ${expectedOverride}, got ${goal.configuration?.profileOverride?.state}`)
          if (expectedDisabled !== '-' && String(goal.configuration?.effectiveDisabled) !== expectedDisabled) throw new Error(`expected effectiveDisabled=${expectedDisabled}, got ${goal.configuration?.effectiveDisabled}`)
          NODE
          }
          start_dsh() {
            "$DSH" web --port "$DSH_PORT" > "$ISOLATED/dsh.log" 2>&1 &
            DSH_PID=$!
            wait_for_inspection "$ISOLATED/inspection.json"
          }
          assert_no_structural_drift() {
            node --input-type=module - "$1" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const inspection = JSON.parse(await readFile(process.argv[2], 'utf8'))
          if (inspection.compatibility?.driftedCount !== 0) throw new Error(`unexpected structural drift: ${JSON.stringify(inspection.compatibility?.findings)}`)
          NODE
          }
          print_compatibility() {
            node --input-type=module - "$ISOLATED/inspection.json" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const inspection = JSON.parse(await readFile(process.argv[2], 'utf8'))
          console.log(JSON.stringify({ compatibility: inspection.compatibility }))
          NODE
          }
          restart_dsh() {
            kill "$DSH_PID"
            wait "$DSH_PID" || true
            start_dsh
            print_compatibility
          }
          post_toggle() {
            local action="$1" output="$2" status
            status="$(curl --silent --show-error -o "$output" -w '%{http_code}' -X POST -H 'content-type: application/json' --data "{\"action\":\"$action\"}" http://127.0.0.1:39103/api/builtin-toggles/ui-goal)"
            if [ "$status" != 200 ]; then
              echo "toggle $action returned HTTP $status" >&2
              cat "$output" >&2
              return 1
            fi
          }
          trap 'kill "$DSH_PID" 2>/dev/null || true' EXIT
          start_dsh
          # Initial v1 body is parsed, not merely treated as an HTTP 2xx.
          print_compatibility
          assert_no_structural_drift "$ISOLATED/inspection.json"
          assert_goal "$ISOLATED/inspection.json" inherited false
          curl --fail --silent http://127.0.0.1:39103/api/builtin-toggles > "$ISOLATED/legacy.json"
          post_toggle force-disable "$ISOLATED/force-disable.json"
          node --input-type=module - "$ISOLATED/force-disable.json" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const result = JSON.parse(await readFile(process.argv[2], 'utf8'))
          if (result.runtimeEffect !== 'applied') throw new Error('force-disable was not runtime-applied')
          NODE
          wait_for_inspection "$ISOLATED/after-disable.json"
          assert_goal "$ISOLATED/after-disable.json" explicitly-disabled true
          # Explicit profile overrides must survive an actual DSH restart.
          restart_dsh
          assert_no_structural_drift "$ISOLATED/inspection.json"
          assert_goal "$ISOLATED/inspection.json" explicitly-disabled true
          post_toggle force-enable "$ISOLATED/force-enable.json"
          node --input-type=module - "$ISOLATED/force-enable.json" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const result = JSON.parse(await readFile(process.argv[2], 'utf8'))
          if (result.runtimeEffect !== 'applied') throw new Error('force-enable was not runtime-applied')
          NODE
          wait_for_inspection "$ISOLATED/after-enable.json"
          assert_goal "$ISOLATED/after-enable.json" explicitly-enabled false
          post_toggle restore-inheritance "$ISOLATED/restore.json"
          node --input-type=module - "$ISOLATED/restore.json" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const result = JSON.parse(await readFile(process.argv[2], 'utf8'))
          if (result.runtimeEffect !== 'recomposing') throw new Error('restore incorrectly claimed immediate runtime application')
          NODE
          for attempt in $(seq 1 20); do
            wait_for_inspection "$ISOLATED/after-restore.json"
            if node --input-type=module - "$ISOLATED/after-restore.json" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const inspection = JSON.parse(await readFile(process.argv[2], 'utf8'))
          process.exit(inspection.capabilities?.find((entry) => entry.id === 'ui-goal')?.configuration?.profileOverride?.state === 'inherited' ? 0 : 1)
          NODE
            then break; fi
            sleep 1
          done
          assert_goal "$ISOLATED/after-restore.json" inherited -
          # Recomposition must also preserve inherited state after restart.
          restart_dsh
          assert_no_structural_drift "$ISOLATED/inspection.json"
          assert_goal "$ISOLATED/inspection.json" inherited -
          # A second normal-RNG Host home must not depend on the first run's
          # generated Loader ids either.
          kill "$DSH_PID"
          wait "$DSH_PID" || true
          export DSH_HOME="$ISOLATED/second-home"
          DSH_PORT=39104
          "$DSH" plugin --profile web add "$GITHUB_WORKSPACE/.agent-tmp/compatibility/$PLUGIN_TARBALL"
          start_dsh
          assert_no_structural_drift "$ISOLATED/inspection.json"
      - name: Compatibility summary
        run: |
          {
            echo '## Reviewed baseline lane'
            echo ''
            echo '- DSH: @deepseek-ai/dsh-base@0.1.0-rc.6 + @deepseek-ai/dsh-web-app@0.1.0-rc.6'
            echo '- Plugin: local npm pack tarball'
            echo '- Result: baseline roster, isolated install/load, legacy/v1 API, force/restore persistence and restart, observable drift fail-closed, and trust-fence tests passed.'
            echo '- Browser smoke: not claimed here; it needs a stable public DSH browser harness.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reviewed-rc6-compatibility
          path: .agent-tmp/compatibility/baseline.json

  current-public-observation:
    name: current public observation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 11.21.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.19.0
      - name: Compare current published DSH patches without changing support claims
        run: |
          set -euo pipefail
          VERSION="$(npm view @deepseek-ai/dsh version)"
          OBSERVATION="$RUNNER_TEMP/dsh-current-public"
          mkdir -p "$OBSERVATION/base" "$OBSERVATION/web"
          if npm pack --pack-destination "$OBSERVATION" "@deepseek-ai/dsh-base@$VERSION" "@deepseek-ai/dsh-web-app@$VERSION"; then
            BASE_TARBALL="$(find "$OBSERVATION" -maxdepth 1 -name '*dsh-base*.tgz' -print -quit)"
            WEB_TARBALL="$(find "$OBSERVATION" -maxdepth 1 -name '*dsh-web-app*.tgz' -print -quit)"
            test -n "$BASE_TARBALL" && test -n "$WEB_TARBALL"
            tar -xzf "$BASE_TARBALL" -C "$OBSERVATION/base"
            tar -xzf "$WEB_TARBALL" -C "$OBSERVATION/web"
            pnpm install --frozen-lockfile
            pnpm verify:baseline --report "$OBSERVATION/base/package/cordis.patch.yml" "$OBSERVATION/web/package/cordis.patch.yml" > compatibility-current-public.json
            node --input-type=module - "$VERSION" compatibility-current-public.json <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const [version, file] = process.argv.slice(2)
          const report = JSON.parse(await readFile(file, 'utf8'))
          report.package = '@deepseek-ai/dsh'
          report.observedVersion = version
          report.reviewStatus = 'observational-only'
          report.supported = false
          await writeFile(file, `${JSON.stringify(report)}\n`)
          NODE
          else
            printf '{"package":"@deepseek-ai/dsh","observedVersion":"%s","status":"artifact-unavailable","reviewStatus":"observational-only","supported":false}\n' "$VERSION" > compatibility-current-public.json
          fi
          cat compatibility-current-public.json
          echo '## Current public lane' >> "$GITHUB_STEP_SUMMARY"
          echo "- Observed @deepseek-ai/dsh: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Machine-readable roster/package/inject difference report is attached; this is early-warning only.' >> "$GITHUB_STEP_SUMMARY"
          echo '- It does not alter the reviewed baseline, allowlist, or supported-version claim.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: current-public-compatibility
          path: compatibility-current-public.json
